<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} · {{ hospital }}</title>
    <meta name="description" content="{{ hospital }} Management System for patient records, doctor appointments and billing.">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block body %}{% endblock %}

    <div class="toast-stack" aria-live="polite">
        {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="toast toast-{{ category }}">
            {{ icon('check' if category == 'success' else 'alert', 18) }}
            <span>{{ message }}</span>
            <button class="toast-close" type="button" aria-label="Dismiss">{{ icon('x', 14) }}</button>
        </div>
        {% endfor %}
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
